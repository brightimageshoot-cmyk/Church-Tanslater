<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>教會即時翻譯</title><!-- 手機頁啟動時改成「即時翻譯｜실시간 번역｜Live Translation」 -->
<!--
  教會即時翻譯 v1（阿布影像）— 單一檔案
  網址不帶 ?room= → 控台；帶 ?room=房號&v=驗證碼 → 會眾手機；再加 &loadtest=N → 壓力測試頁（一頁最多 50 支）。
  本版範圍：M1 連線與手機、M2 辨識翻譯三語、M3 朗讀與投影（見 09、09b）。
  帶 ?projector=1 是「投影字幕視窗」（只收同一台電腦控台傳來的字幕，不連網路、不算人數）。

  外部程式庫：兩個都從 unpkg 載入 npm 上的原檔，固定版本＋integrity（值見 11 第 2 節；彩排前在能連外的電腦核對，見 13）。
  翻譯金鑰不寫在本檔，只在控台畫面輸入，存在那台電腦的瀏覽器。
-->
<style>
:root{
  --stage-bg:#000000; --text-final:#FFFFFF; --text-partial:#D6D6D6; --text-prev:#A3A3A3; --text-dim:#8C8C8C; --chroma:#00FF00;
  --ok:#22C55E; --warn:#F5B700; --bad:#EF4444; --info:#5EC8FF; --test:#F97316;
  --c-bg:#111418; --c-panel:#1B2027; --c-panel-2:#232A33; --c-line:#36404C; --c-text:#F2F4F7; --c-muted:#B7C0CC; --c-btn:#2C3540;
  --font-zh:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif;
  --font-ko:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --font-en:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-ui:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --fs-xs:13px; --fs-sm:15px; --fs-md:18px; --fs-lg:22px; --fs-xl:28px; --fs-2xl:40px;
  --radius:8px; --tap:48px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);line-height:1.5}
button{font-family:inherit}

/* ---------------- 控台 ---------------- */
body.console{background:var(--c-bg);color:var(--c-text)}
.c-status{display:flex;gap:6px;align-items:stretch;background:#0A0C0F;padding:10px 16px;border-bottom:1px solid var(--c-line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.pill{display:flex;align-items:center;gap:8px;background:var(--c-panel);border:1px solid var(--c-line);border-radius:999px;padding:6px 14px;font-size:var(--fs-sm);white-space:nowrap}
.pill small{color:var(--c-muted);font-size:var(--fs-xs)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:#5b6573}
.dot.ok,[data-color=green] .dot{background:var(--ok)} .dot.warn,[data-color=yellow] .dot{background:var(--warn)} .dot.bad,[data-color=red] .dot{background:var(--bad)}
.c-status .sep{width:1px;background:var(--c-line);margin:0 6px}
.badge-test{background:#7C2D12;color:#FFEDD5;border:1px solid var(--test);border-radius:6px;padding:6px 12px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.c-status .right{margin-left:auto;display:flex;gap:6px}
.c-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){.c-body{grid-template-columns:1fr}}
.c-main{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.c-side{background:#0E1115;border-left:1px solid var(--c-line);padding:20px;display:flex;flex-direction:column;gap:16px}
.step{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.step .no{width:36px;height:36px;border-radius:50%;background:var(--c-btn);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.step.done .no{background:var(--ok);color:#000}
.step.later{opacity:.7}
.step h3{margin:0 0 8px;font-size:var(--fs-md);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step h3 .state{font-size:var(--fs-sm);font-weight:400;color:var(--c-muted)}
.step.done h3 .state{color:#86EFAC}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:var(--fs-sm);color:var(--c-muted)}
.hint.warnline{color:#FCD34D}
.later-note{font-size:var(--fs-sm);color:#93C5FD}
.field{height:var(--tap);background:#0E1115;border:1px solid var(--c-line);border-radius:6px;color:var(--c-text);padding:0 12px;font-size:var(--fs-md);min-width:220px;font-family:inherit}
select.field{min-width:170px}
.lbl{font-size:var(--fs-sm);color:var(--c-muted);display:block;margin-bottom:4px}
.btn{height:var(--tap);min-width:var(--tap);padding:0 18px;border-radius:6px;border:1px solid var(--c-line);background:var(--c-btn);color:var(--c-text);font-size:var(--fs-md);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{background:var(--info);color:#000;border-color:var(--info);font-weight:700}
.btn.primary{background:#2563EB;border-color:#2563EB;font-weight:700}
.btn.big{height:64px;font-size:var(--fs-lg);width:100%}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:#7F1D1D;color:#FCA5A5}
kbd{display:inline-block;min-width:22px;padding:0 6px;border:1px solid #6b7684;border-bottom-width:2px;border-radius:4px;font-family:var(--font-en);font-size:13px;line-height:20px;text-align:center;color:var(--c-text);background:#1a1f26}
.btn.sel kbd{color:#000;border-color:#000;background:transparent}
.dir-now{font-size:var(--fs-2xl);font-weight:800;letter-spacing:2px;padding:4px 18px;border:2px solid var(--info);border-radius:8px;color:var(--info);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--c-line);border-radius:6px;overflow:hidden}
.seg .btn{border:0;border-radius:0;border-right:1px solid var(--c-line)}
.seg .btn:last-child{border-right:0}
.qrbox{background:#fff;border-radius:6px;padding:4px;display:flex;align-items:center;justify-content:center;width:208px;min-height:208px;color:#000;font-size:var(--fs-sm);text-align:center}
.qrbox canvas{width:200px;height:200px;image-rendering:pixelated;display:block}
.room-big{font-size:var(--fs-xl);font-weight:700;font-family:var(--font-en);letter-spacing:1px}
.linkbox{min-width:0;width:100%;max-width:620px;font-size:var(--fs-sm);font-family:var(--font-en);height:auto;min-height:var(--tap);padding:10px 12px;word-break:break-all;display:block}
.meter{width:260px;height:14px;border-radius:7px;background:#0E1115;border:1px solid var(--c-line);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ok) 70%,var(--warn) 90%,var(--bad));transition:width .08s}
.src-preview{background:#0E1115;border:1px dashed var(--c-line);border-radius:6px;padding:8px 12px;font-size:var(--fs-sm);color:var(--c-muted);margin-top:8px;min-height:40px}
.src-preview .final{color:var(--c-text)}
textarea.field{height:auto;min-height:120px;padding:10px 12px;width:100%;max-width:620px;font-size:var(--fs-sm);line-height:1.6;resize:vertical}
.diag{font-size:var(--fs-xs);color:var(--c-muted);max-height:260px;overflow:auto;background:#0E1115;border:1px solid var(--c-line);border-radius:6px;padding:8px 10px}
.diag div{padding:2px 0;border-bottom:1px solid #1d232b}
.diag .k-anomaly,.diag .k-timeout,.diag .k-error{color:#FCA5A5}
.preview{background:#000;border-radius:6px;padding:12px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.preview .pl{font-size:var(--fs-lg);font-weight:700;color:var(--text-final);line-height:1.35}
.preview .pl.prev{color:var(--text-prev);font-weight:500;font-size:var(--fs-md)}
.preview .pl.partial{color:var(--text-partial)}
.health{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--radius);padding:12px 14px}
.c-side h4{margin:0 0 8px;font-size:var(--fs-sm);color:var(--c-muted);font-weight:400}
.hrow{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:var(--fs-sm);padding:4px 0}
.hrow b{font-size:var(--fs-md)}
.hrow[data-color=yellow] b{color:#FDE68A} .hrow[data-color=red] b{color:#FCA5A5}
.hrow .t{font-size:var(--fs-xs);color:var(--c-muted);grid-column:2 / 4;margin-top:-4px}
.keys{font-size:var(--fs-sm);line-height:2}
.keys div{display:flex;justify-content:space-between;gap:8px}
details.adv{background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--radius);padding:10px 16px}
details.adv summary{font-size:var(--fs-md);cursor:pointer;color:var(--c-muted)}
details.adv .advbody{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.msg{border-radius:6px;padding:10px 14px;font-size:var(--fs-md);margin:6px 0;display:flex;gap:10px;align-items:flex-start}
.msg .dot{margin-top:7px}
.msg.ok{background:#052e16;border:1px solid #166534;color:#BBF7D0}
.msg.warn{background:#3a2a00;border:1px solid #a16207;color:#FDE68A}
.msg.bad{background:#3b0a0a;border:1px solid #991b1b;color:#FECACA}
.flash{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.88);border:3px solid var(--info);border-radius:16px;padding:22px 56px;text-align:center;z-index:100;transition:opacity .4s;pointer-events:none}
.flash .big{font-size:96px;font-weight:800;line-height:1.1;color:#fff;letter-spacing:4px;white-space:nowrap}
.flash .small{font-size:20px;color:var(--c-muted)}
.flash.fade{opacity:0}
.locked{max-width:640px;margin:12vh auto;background:var(--c-bg);padding:28px}
.locked h1{margin:0 0 10px;font-size:var(--fs-xl)}
.locked p{margin:0 0 14px;font-size:var(--fs-md);color:var(--c-muted)}
.checkbox{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--c-muted);cursor:pointer}
.checkbox input{width:20px;height:20px}

/* ---------------- 投影（單螢幕投影模式、投影字幕視窗共用；字級用畫面高度百分比，10 第 3 節） ---------------- */
.proj{position:fixed;inset:0;z-index:60;background:#000}
.stage{position:absolute;inset:0;background:var(--stage-bg);container-type:size;overflow:hidden;font-family:var(--font-ui)}
.stage.chroma{background:var(--chroma,#00FF00)}
.cap{position:absolute;left:0;right:0;bottom:8%;display:flex;flex-direction:column;align-items:center;gap:1.5cqh;--k:1}
.cap.lift{bottom:20%}
.cap.center{bottom:auto;top:50%;transform:translateY(-50%)}
.line{text-align:center;line-height:1.3;font-weight:700;color:var(--text-final);max-height:3.9em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.line > span{display:block}
.line.prev{color:var(--text-prev);font-weight:500}
.line.partial{color:var(--text-partial)}
.line.zh{font-family:var(--font-zh)}
.line.ko{font-family:var(--font-ko);word-break:keep-all}
.line.en{font-family:var(--font-en);word-break:normal;overflow-wrap:break-word;hyphens:none}   /* 一般單字整字換行；比一整行還長的字（網址）才拆開（09d R1） */
.line.zh.cur,.line.ko.cur{font-size:calc(min(9cqh,90cqw/16)*var(--k));max-width:min(90cqw,calc(16em/var(--k)))}
.line.zh.prev,.line.ko.prev{font-size:calc(min(9cqh,90cqw/16)*.8*var(--k));max-width:min(90cqw,calc(20em/var(--k)))}
.r43 .line.zh.cur,.r43 .line.ko.cur{font-size:calc(min(9cqh,90cqw/12)*var(--k));max-width:min(90cqw,calc(12em/var(--k)))}
.r43 .line.zh.prev,.r43 .line.ko.prev{font-size:calc(min(9cqh,90cqw/12)*.8*var(--k));max-width:min(90cqw,calc(15em/var(--k)))}
/* 英文每行字數：寬度用「字數 × 平均字寬 0.48em」（粗體實測 0.477em；10 原寫的 ch 是數字 0 的寬，會多塞 15–25%）。
   一行最多約 36（16:9）／26（4:3）字元；因為整字換行，最新一句實際每行 16:9 約 29–34、4:3 約 20–25 字元。
   上一句字小一號、同寬，會多約兩成。Windows 字型要彩排時再量（12 M3 第 6 節、09d） */
.line.en.cur{font-size:calc(7.4cqh*var(--k));max-width:min(90cqw,calc(17.3em/var(--k)))}
.line.en.prev{font-size:calc(7.4cqh*.8*var(--k));max-width:min(90cqw,calc(21.6em/var(--k)))}
.r43 .line.en.cur{max-width:min(90cqw,calc(12.5em/var(--k)))}
.r43 .line.en.prev{max-width:min(90cqw,calc(15.6em/var(--k)))}
.chroma .line{color:#fff;-webkit-text-stroke:.25cqh #000;paint-order:stroke fill;text-shadow:0 0 .6cqh rgba(0,0,0,.9)}
.chroma .line.prev{color:#E6E6E6}
.chroma .line.partial{color:#F2F2F2}
.paused{position:absolute;left:0;right:0;bottom:4%;text-align:center;color:var(--text-dim);font-size:3.2cqh;line-height:1.35}
.paused span{display:block}
.chroma .paused{color:#fff;-webkit-text-stroke:.15cqh #000;paint-order:stroke fill}
.corner{position:absolute;right:1.5cqw;bottom:.8cqh;display:flex;align-items:center;gap:.8cqw;opacity:.2;transition:opacity .3s}
.corner.show{opacity:1}
.cbtn{width:6.4cqh;height:6.4cqh;border-radius:1cqh;background:rgba(40,46,54,.9);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:1.8cqh;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;text-align:center;font-family:var(--font-ui);padding:0;cursor:pointer}
.cbtn em{font-style:normal;font-size:1.4cqh;color:#cfd6df}
.sdot{display:flex;align-items:center;gap:.6cqw;font-size:2.2cqh;color:#cfd6df;margin-right:.6cqw}
.sdot .dot{width:1.8cqh;height:1.8cqh}
.sdot.blink .dot{animation:blink3 .6s 3}
@keyframes blink3{50%{opacity:.1}}
.tip{position:absolute;right:1.5cqw;bottom:9cqh;background:rgba(20,24,29,.95);border:1px solid #444;border-radius:1cqh;padding:1.2cqh 1.6cqw;color:#fff;font-size:2.3cqh;line-height:1.5;text-align:left;max-width:50cqw}
.qr-over{position:absolute;inset:0;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;cursor:pointer;z-index:3}
.qr-over canvas{height:58cqh;width:58cqh;image-rendering:pixelated}
.qr-over .t1{font-size:4.2cqh;font-weight:700;text-align:center;line-height:1.3}
.qr-over .t1 span{display:block}
.qr-over .t2{font-family:var(--font-en);font-size:3.2cqh;letter-spacing:.05em}
.qr-over .t3{font-size:2.8cqh;text-align:center;line-height:1.35;color:#333}
.qr-over .t3 span{display:block}
.flash.small{padding:14px 36px}
.flash.small .big{font-size:56px}
body.projwin{background:#000;overflow:hidden;margin:0}
.warnmark{background:var(--warn);color:#000;border-radius:50%;width:20px;height:20px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800}

/* ---------------- 手機 ---------------- */
body.phone{background:var(--stage-bg);color:var(--text-final);overflow:hidden}
.ph{position:fixed;inset:0;display:flex;flex-direction:column}
.p-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 8px calc(env(safe-area-inset-left,0px) + 10px);background:#0B0B0B;border-bottom:1px solid #2a2a2a;display:flex;gap:8px;align-items:center;transition:opacity .2s}
.p-top.dim{opacity:.35;pointer-events:none}
.p-read{height:52px;flex:0 0 132px;border-radius:10px;border:2px solid #555;background:#2B2B2B;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;text-align:center;padding:0 6px;cursor:pointer}
.p-read.on{background:var(--info);border-color:var(--info);color:#000}
.p-speed{display:flex;flex:1;border:1px solid #555;border-radius:10px;overflow:hidden;height:52px;min-width:0}
.p-speed button{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#ddd;background:transparent;border:0;border-right:1px solid #444;text-align:center;line-height:1.1;padding:0 2px;cursor:pointer;min-width:0}
.p-speed button:last-child{border-right:0}
.p-speed button.sel{background:#EDEDED;color:#000;font-weight:700}
.p-set{width:48px;height:52px;border-radius:10px;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ddd;flex:none;background:transparent;cursor:pointer}
.banners{flex:none}
.banner{padding:10px 14px;font-size:14.5px;line-height:1.45;display:flex;gap:10px}
.banner span{display:block}
.banner .x{margin-left:auto;font-size:18px;line-height:1;padding:2px 6px;color:inherit;opacity:.8;align-self:flex-start;background:transparent;border:0;cursor:pointer;min-height:32px}
.banner.y{background:var(--warn);color:#000}
.banner.n{background:#1F2937;color:#F3F4F6;border-bottom:1px solid #374151}
.p-main{flex:1;position:relative;min-height:0}
.p-feed{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.p-feed-in{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:16px calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 72px) calc(env(safe-area-inset-left,0px) + 18px)}
.sent{font-size:var(--p-fs,28px);line-height:1.6;font-weight:600;color:var(--text-final);font-family:var(--font-zh);overflow-wrap:anywhere}
.sent.old{color:var(--text-prev);font-weight:500}
.sent.part{color:var(--text-partial)}
.sent.en{font-family:var(--font-en);font-size:calc(var(--p-fs,28px) - 2px);line-height:1.5;overflow-wrap:break-word;word-break:normal}
.sent.ko{font-family:var(--font-ko);word-break:keep-all}
.tag{display:inline-block;font-size:13px;font-weight:700;line-height:20px;padding:0 6px;border-radius:4px;border:1px solid #777;color:#ccc;margin-right:8px;vertical-align:5px;font-family:var(--font-ui)}
.divider{display:flex;align-items:center;gap:10px;color:#cfcfcf;font-size:15px;margin:4px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#666}
.latest{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#EDEDED;color:#000;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap;border:0;min-height:48px;cursor:pointer}
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:6px;background:var(--stage-bg)}
.center-msg .l1{font-size:22px;font-weight:700;line-height:1.4}
.center-msg .l2{font-size:20px;font-weight:700;line-height:1.4;font-family:var(--font-ko);word-break:keep-all}
.center-msg .l3{font-size:19px;font-weight:600;line-height:1.4;font-family:var(--font-en)}
.center-msg .sub{font-size:15px;color:#BDBDBD;line-height:1.5;margin-top:14px}
.center-msg .sub span,.center-msg .card span{display:block}
.center-msg .card{margin-top:16px;border:1px solid #444;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;color:#E5E5E5;text-align:left}
.breath{width:14px;height:14px;border-radius:50%;background:#9CA3AF;margin:18px auto 0;opacity:.6;animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.8;transform:scale(1.1)}}
.bigicon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin-bottom:14px;color:#000}
.cap-ko{font-family:var(--font-ko);word-break:keep-all} .cap-en{font-family:var(--font-en)}
.p-sheet{position:absolute;left:0;right:0;bottom:0;background:#1A1A1A;border-top:1px solid #444;border-radius:16px 16px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 26px);z-index:6}
.p-sheet h5{margin:0 0 10px;font-size:16px;color:#ccc;font-weight:500}
.p-sheet .p-speed{height:48px}
.p-sheet .close{margin-top:14px;width:100%;text-align:center;font-size:16px;color:#ddd;border:1px solid #555;border-radius:10px;padding:12px;background:transparent;min-height:48px}
@media (orientation:landscape) and (max-height:500px){
  .p-top{padding-top:4px;padding-bottom:4px}
  .p-read,.p-speed,.p-set{height:44px}
  .sent{font-size:calc(var(--p-fs,28px) * 1.25)}
  .sent.en{font-size:calc((var(--p-fs,28px) - 2px) * 1.25)}
}

/* ---------------- 壓力測試頁 ---------------- */
body.load{background:#111;color:#eee;font-family:var(--font-ui);padding:24px}
body.load h1{font-size:22px;margin:0 0 12px}
body.load .kv{font-size:18px;line-height:1.8}
body.load .kv b{color:#fff;font-family:var(--font-en)}

/* =====================================================================
   4. 講台身分驗證（06 第 3-3 節）
   控台有一組只有自己知道的鑰匙（ECDSA P-256）。網址的 v= 是公鑰指紋的前 12 碼。
   手機每次連線都帶一道新題目（隨機字串），控台簽名；手機核對公鑰指紋和簽名，對不上就不顯示任何內容。
   題目放在連線的附帶資料裡，所以手機在資料通道上只會送「我還在」。

  },
  /** 檢查並載入一組鑰匙；格式不對或公私鑰不成對就丟出錯誤 */
  async load(jwks) {
    if (!jwks || typeof jwks !== 'object' || !jwks.priv || !jwks.pub) throw new Error('缺少講台驗證鑰匙');
    const { priv, pub } = jwks;
    for (const k of [priv, pub]) if (typeof k !== 'object' || k.kty !== 'EC' || k.crv !== 'P-256' || typeof k.x !== 'string' || typeof k.y !== 'string') throw new Error('講台驗證鑰匙格式不對');

    if (!await crypto.subtle.verify(SIGN, publicKey, sig, probe)) throw new Error('講台驗證鑰匙不成對');
    const spki = await crypto.subtle.exportKey('spki', publicKey);
    const code = b64u(await crypto.subtle.digest('SHA-256', spki)).slice(0, CONFIG.CODE_LEN);
    return { jwks: { priv: clean(priv), pub: clean(pub) }, privateKey, publicKey, pubB64: b64u(spki), code };
  },
  async sign(key, room, nonce) { return b64u(await crypto.subtle.sign(SIGN, key.privateKey, authBytes(room, nonce))); },
  /** 手機端：公鑰指紋要等於網址的 v=，簽名要對得上這次的題目 */
  async verify(pubB64, sigB64, room, nonce, code) {
    try {
      if (typeof pubB64 !== 'string' || typeof sigB64 !== 'string' || pubB64.length > 400 || sigB64.length > 200) return false;
      const spki = unb64u(pubB64);

    } catch (e) { return false; }
  },

      if (p.disconnected) { try { p.reconnect(); } catch (e) { this._newPeer(); } return; }

    try { c = this.peer.connect(this.room, { serialization: 'raw', reliable: true, metadata: meta }); } catch (e) { logWarn('connect', e); this._scheduleRetry(); return; }

    c.on('data', d => { if (c === this.conn) this.emit('data', d); });

/* =====================================================================
   6. 控台：廣播給手機（主程式這一段：驗證、心跳、人數、節流、補句、健康燈號）

      this.recent.sort((a, b) => a.id - b.id);

}

  const synth = window.speechSynthesis; if (!synth) return null;
  let vs = []; try { vs = synth.getVoices() || []; } catch (e) {}
  if (!vs.length) return undefined;
  const key = keyOfCode(langCode);
  const norm = v => String(v.lang || '').replace(/_/g, '-').toLowerCase();
  const cantonese = v => /(^|-)hk$|yue|zh-hk|cantonese|粵|廣東/.test(norm(v) + ' ' + String(v.name || '').toLowerCase());
  const cands = vs.filter(v => !cantonese(v));
  const ofKey = v => key === 'zh' ? /^(zh|cmn)/.test(norm(v)) : norm(v).startsWith(key);
  const saved = LS.get('voice.' + langCode, '');
  let pick = saved ? cands.find(v => v.name === saved && ofKey(v)) : null;
  if (!pick) {
    if (key === 'zh') pick = cands.find(v => norm(v) === 'zh-tw') || cands.find(v => /^(cmn-hant-tw|zh-hant)/.test(norm(v))) || cands.find(v => /^(zh-cn|cmn-hans|cmn-cn|zh-hans)/.test(norm(v))) || cands.find(ofKey);

  msg(sel, kind, text) {
    const box = $(sel); if (!box) return;
    box.innerHTML = '';
    if (!text) return;
    const d = document.createElement('div'); d.className = 'msg ' + kind; d.dataset.state = kind;
    d.innerHTML = `<span class="dot ${kind === 'ok' ? 'ok' : kind === 'warn' ? 'warn' : 'bad'}"></span><span></span>`;
    d.lastChild.textContent = text; box.appendChild(d);
  },

  /* ---- 金鑰（存放方式＋「不記住」；M1 不呼叫翻譯服務） ---- */
  bindKey() {
    const inp = $('#keyInput'), forget = $('#keyForget');
    forget.checked = LS.get('keyNoRemember', '0') === '1';
    inp.value = (forget.checked ? SS.get('apiKey', '') : LS.get('apiKey', '')) || SS.get('apiKey', '');
    const save = () => {
      const v = inp.value.trim();
      if (forget.checked) { LS.del('apiKey'); v ? SS.set('apiKey', v) : SS.del('apiKey'); }
      else { SS.del('apiKey'); v ? LS.set('apiKey', v) : LS.del('apiKey'); }
      this.keyState();
    };
    inp.addEventListener('input', save);
    forget.addEventListener('change', () => { LS.set('keyNoRemember', forget.checked ? '1' : '0'); save(); });
    $('#keyShow').onclick = () => { const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; $('#keyShow').textContent = show ? '隱藏' : '顯示'; };
    $('#keyClear').onclick = () => { inp.value = ''; save(); };
    $('#keyTest').onclick = () => this.testKey();
    this.keyState();
  },
  apiKey() { return (LS.get('keyNoRemember', '0') === '1' ? SS.get('apiKey', '') : LS.get('apiKey', '')) || ''; },
  keyState() {
    const has = !!this.apiKey();
    if (this.translator && (this.translator.blocked === 'key' || this.translator.blocked === 'quota')) { this.translator.unblock(); this.msg('#keyMsg', '', ''); }
    if (this.translator && $('[data-testid=api-status]')) this.onApiState(has ? 'unknown' : 'nokey');
    $('#keyState').textContent = has ? '已輸入（請按「測試」確認）' : '還沒輸入';
    $('#step1').classList.toggle('done', has);
    $('#step1 .no').textContent = has ? '✓' : '1';
  },

  /* ---- 房號、連結、QR ---- */
  bindRoom() {
    $('#btnCopy').onclick = async () => {
      try { await navigator.clipboard.writeText(this.link); this.msg('#roomMsg', 'ok', '已複製連結'); }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('#linkBox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); this.msg('#roomMsg', 'warn', '瀏覽器不讓網頁直接複製：連結已經選起來了，請按 Ctrl+C。'); }
      setTimeout(() => { const m = $('#roomMsg .msg'); if (m && m.dataset.state === 'ok') this.msg('#roomMsg', '', ''); }, 2500);
    };
    $('#btnQrDl').onclick = () => this.downloadQR();
  },
  buildLink(room) {
    const base = location.origin + location.pathname;
    return `${base}?room=${encodeURIComponent(room)}&v=${this.key.code}`;
  },
  updateLink() {
    this.link = this.buildLink(this.room);
    const rb = $('#roomBig'); rb.textContent = this.room; rb.dataset.state = this.room;
    const lb = $('#linkBox'); lb.textContent = this.link; lb.dataset.state = this.link;
    $('#roomInput').value = this.room;
    const ll = $('#loadLink'); ll.textContent = this.link + '&loadtest=50'; ll.dataset.state = this.link + '&loadtest=50';
    this.drawQR();
    if (location.protocol === 'file:') this.msg('#roomMsg', 'bad', '這個網頁是直接從檔案打開的，連結和 QR Code 手機用不了。請用固定的 https 網址開啟控台。');
  },
  makeMatrix(text) {
    if (typeof window.QRCode !== 'function') return null;
    const tmp = document.createElement('div'); tmp.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;height:10px;overflow:hidden';
    document.body.appendChild(tmp);
    try {

  paintQR(canvas, rows, ppm, quiet) {

    g.fillStyle = '#000000';

  combos: { 1: ['ko', 'zh'], 2: ['zh', 'en'], 3: ['ko', 'en'] },
  activeCombo() { const { src, dst } = this.state; for (const [n, [a, b]] of Object.entries(this.combos)) if ((src === a && dst === b) || (src === b && dst === a)) return +n; return 0; },
  swap() { this.setDir(this.state.dst, this.state.src, 'swapped'); },
  combo(n) {

  setDir(src, dst, flash) {

  flashDir(kind) { const { src, dst } = this.state; this.flash(`${LANGS[src].short} → ${LANGS[dst].short}`, kind === 'current' ? TC.flashCurrent : TC.flashSwapped, kind); },
  flash(big, small, kind) {

  onKey(e) {
    // 看實體鍵（event.code），不看打出來的字；游標在輸入框時不作用（06、04 1-2）
    if (e.defaultPrevented || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
    if (typing(e.target) || typing(document.activeElement)) return;
    let hit = true;
    switch (e.code) {
      case 'KeyS': this.swap(); break;
      case 'KeyP': this.setMode(this.state.mode === 'sermon' ? 'daily' : 'sermon'); break;
      case 'Digit1': case 'Numpad1': this.combo(1); break;
      case 'Digit2': case 'Numpad2': this.combo(2); break;

      default: hit = false;

  /** 先全部檢查過才寫入；任何一項不對就整個拒絕，原本的設定不動（AT-07） */
  async importText(text) {

    let d; try { d = JSON.parse(text); } catch (e) { throw new Error('檔案壞掉了，或不是設定檔（讀不出內容）'); }
    if (!d || typeof d !== 'object' || d.app !== 'abuTr' || d.kind !== 'settings') throw new Error('這個檔案不是本系統匯出的設定檔');

/* =====================================================================
   8. 手機：收字幕（驗證、心跳回應、斷線偵測）
   ===================================================================== */
class ViewerSession extends Emitter {
  constructor(room, code, kind) { super(); this.room = room; this.code = code; this.kind = kind; this.authed = false; this.nonce = null; this.lastData = 0; this.stopped = false; }
  start() {
    const T = TRANSPORTS[CONFIG.TRANSPORT].Viewer;
    const t = this.t = new T();
    t.on('status', s => this.emit('status', s));
    t.on('retry', d => this.emit('retry', d));
    t.on('open', meta => {
      this.authed = false; this.lastData = Date.now();
      clearTimeout(this.authT);
      this.authT = setTimeout(() => { if (!this.authed && !this.stopped) { this.emit('status', 'auth-timeout'); t.reconnect(); } }, CONST.AUTH_TIMEOUT_MS);
    });
    t.on('data', d => this._data(d));
    t.join(this.room, () => { this.nonce = randB64u(18); this.authed = false; return { v: 1, ch: this.nonce, k: this.kind }; });
    this.wd = setInterval(() => {
      if (this.authed && Date.now() - this.lastData > CONST.DEAD_AFTER_MS) { this.authed = false; this.emit('status', 'dead'); t.reconnect(); }
    }, 1000);
  }
  /** 網路回來（online）或切回前景時：正在等連線、或已經一陣子沒收到資料，就立刻重試，不等 15 秒（09d D4） */
  kick(why) {
    if (this.stopped) return;
    const stale = Date.now() - this.lastData > CONST.HEARTBEAT_MS + 1000;
    if (!this.authed || !this.t.isOpen || stale) { this.authed = false; this.emit('status', 'closed'); this.t.retryNow(); }
  }
  /** 關分頁時主動告別，控台馬上扣人數（09d D5） */
  bye() { if (this.stopped) return; this.stop(); }
  stop() { this.stopped = true; clearInterval(this.wd); clearTimeout(this.authT); if (this.t) this.t.leave(); }
  async _data(d) {
    if (this.stopped || typeof d !== 'string' || d.length > 200000) return;
    let o; try { o = JSON.parse(d); } catch (e) { return; }
    if (!o || typeof o !== 'object' || o.v !== 1) return;
    this.lastData = Date.now();
    if (!this.authed) {
      // 驗證前只看「見面包」和「已滿」，其他一律不顯示（冒充者直接送字幕也沒用）
      if (o.type !== 'hello' && o.type !== 'full' && o.type !== 'reject') { this.emit('ignored', o.type); return; }
      const nonce = this.nonce;
      const ok = await Pulpit.verify(o.pub, o.sig, this.room, nonce, this.code);
      if (this.stopped || nonce !== this.nonce) return;
      clearTimeout(this.authT);
      if (!ok) { this.emit('authfail'); return; }
      if (o.type === 'full') { this.emit('full'); return; }
      if (o.type === 'reject') { this.emit('reject', String(o.reason || '')); return; }
      this.authed = true;
      this.emit('hello', o);
      return;
    }
    if (o.type === 'ping') { if (typeof o.ts === 'number') this.t.send(JSON.stringify({ type: 'pong', t: o.ts })); this.emit('ping', o); return; }
    if (o.type === 'sub' || o.type === 'clear') this.emit('packet', o);
  }
}
function cleanSub(s) {
  if (!s || typeof s !== 'object') return null;
  if (!Number.isSafeInteger(s.id) || typeof s.text !== 'string' || !keyOfCode(s.lang)) return null;
  return { id: s.id, text: s.text.slice(0, CONST.MAX_TEXT_CHARS), isFinal: s.isFinal === true, lang: s.lang, srcLang: keyOfCode(s.srcLang) ? s.srcLang : null };
}

  onStatus(s) {

/* =====================================================================
   9. 壓力測試頁（一頁最多 50 支；控台顯示「有測試連線」）
   ===================================================================== */
const LoadApp = {
  boot(params, n) {
    document.body.className = 'load';
    const want = n, count = Math.max(1, Math.min(CONST.LOADTEST_MAX, n | 0));
    const S = Object.assign(window.__ABU_STATS__, { mode: 'load', requested: want, count, authed: 0, subs: 0, finals: 0, authFail: 0, full: 0, rejected: 0, received: 0 });
    $('#app').innerHTML = `<h1>壓力測試頁（模擬手機）</h1>
      <div class="kv">房號：<b id="lRoom"></b><br>這一頁模擬：<b data-testid="load-count" id="lCount"></b> 支（網址要 <span id="lWant"></span> 支，一頁最多 ${CONST.LOADTEST_MAX} 支）<br>
      已連上並通過講台驗證：<b data-testid="load-authed" id="lAuthed">0</b><br>收到字幕包：<b data-testid="load-subs" id="lSubs">0</b>（整句 <b id="lFinals">0</b>）<br>
      人數已滿被擋：<b data-testid="load-full" id="lFull">0</b>　驗證失敗：<b data-testid="load-authfail" id="lAuthFail">0</b><br>
      控台沒開「允許壓力測試連線」被拒：<b data-testid="load-rejected" id="lRejected">0</b></div>
      <p class="hint" style="color:#aaa">這一頁只用來測試控台撐不撐得住。控台畫面會顯示橘色「有測試連線」。正式聚會時請不要開。</p>`;
    const room = (params.get('room') || '').toLowerCase(), code = params.get('v') || '';
    $('#lRoom').textContent = room; $('#lCount').textContent = count; $('#lCount').dataset.state = count; $('#lWant').textContent = want;
    if (!ROOM_RE.test(room) || !CODE_RE.test(code) || typeof window.Peer !== 'function') { $('#app').insertAdjacentHTML('beforeend', '<p style="color:#f88">網址不完整或連線元件沒載入。</p>'); return; }
    const paint = () => { $('#lAuthed').textContent = S.authed; $('#lAuthed').dataset.state = S.authed; $('#lSubs').textContent = S.subs; $('#lSubs').dataset.state = S.subs; $('#lFinals').textContent = S.finals; $('#lFull').textContent = S.full; $('#lFull').dataset.state = S.full; $('#lAuthFail').textContent = S.authFail; $('#lRejected').textContent = S.rejected; $('#lRejected').dataset.state = S.rejected; };
    setInterval(paint, 500);
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const s = new ViewerSession(room, code, 'load');
        let authed = false;
        s.on('hello', () => { if (!authed) { authed = true; S.authed++; } });
        s.on('status', st => { if ((st === 'closed' || st === 'dead') && authed) { authed = false; S.authed--; } });
        s.on('packet', p => { S.received++; if (p.type === 'sub') { S.subs++; if (p.isFinal) S.finals++; } });
        s.on('authfail', () => { S.authFail++; s.stop(); });
        s.on('full', () => { S.full++; s.stop(); });
        s.on('reject', () => { S.rejected++; s.stop(); });
        s.start();
      }, i * 30);
    }
  },
};

/* =====================================================================
   10. 啟動：不帶 ?room= 是控台，帶了是手機
   ===================================================================== */
(function main() {
  const params = new URLSearchParams(location.search);
  try {
    if (params.has('room')) {
      const lt = params.get('loadtest');
      if (lt != null && /^\d+$/.test(lt) && +lt > 0) LoadApp.boot(params, +lt);
      else PhoneApp.boot(params);
    } else if (params.get('projector') === '1') {
      ProjectorApp.boot();
    } else {
      ConsoleApp.boot();
    }
  } catch (e) {
    logWarn('boot', e);
    // 10 6.6 msg.bootFail：備用畫面不依賴文字表，三語寫死
    document.body.innerHTML = '<div style="color:#fff;background:#000;min-height:100vh;padding:24px;font-size:20px;line-height:1.5;font-weight:700"><p lang="zh-Hant" style="margin:0 0 8px">畫面啟動失敗，請重新整理</p><p lang="ko" style="margin:0 0 8px">화면을 시작하지 못했습니다. 새로고침해 주세요</p><p lang="en" style="margin:0">Something went wrong. Please refresh the page.</p></div>';
  }
})();
